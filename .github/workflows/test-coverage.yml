name: React App Test & Coverage

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./my-table-app
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './my-table-app/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests with coverage
      run: npm run test:coverage
      
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        directory: ./my-table-app/coverage
        fail_ci_if_error: true
        
    - name: Check coverage thresholds
      run: |
        COVERAGE_FAILED=$(grep -A 4 "ERROR: Coverage for" ./coverage/coverage.txt || echo "")
        if [ ! -z "$COVERAGE_FAILED" ]; then
          echo "Coverage thresholds not met:"
          echo "$COVERAGE_FAILED"
          exit 1
        fi